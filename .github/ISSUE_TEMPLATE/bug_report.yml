name: 问题报告
description: 使用合成档案报告可以复现的问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并使用 `npm run dev:demo` 复现。
        不要上传真实行程、私人统计、身份文件、密钥或完整环境文件。安全问题请先阅读 SECURITY.md，使用私密渠道。
  - type: input
    id: version
    attributes:
      label: 提交或版本
      placeholder: git rev-parse --short HEAD 的结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      placeholder: 操作系统、Node/npm 版本、浏览器、视口尺寸、使用语言。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最好能使用仓库合成档案复现；额外数据只提供合成样例。
      placeholder: |
        1. 运行 npm run dev:demo
        2. 打开 /atlas
        3. ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或合成截图
      description: 只提供与问题相关的片段，清除私有路径与凭证。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有问题，且提供的内容不含私人档案或凭证。
          required: true
